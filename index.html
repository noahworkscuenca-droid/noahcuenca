<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noah Cuenca Chacón · Desarrollador de software</title>
<meta name="description" content="Noah Cuenca Chacón. Desarrollador de software: Python, Streamlit, apps y sitios web a la medida. Costa Rica.">
<meta property="og:title" content="Noah Cuenca Chacón · Desarrollador de software">
<meta property="og:description" content="Apps y herramientas a la medida que simplifican procesos, y sitios web.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://noahcuenca.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --paper:#FBF9F4; --ink:#14130F; --muted:#6B675C; --line:#D9D4C7; --accent:#3B49FF; --on-accent:#fff;
  --sans:'Archivo',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#12110E; --paper:#1A1915; --ink:#F1EEE6; --muted:#9A968A; --line:#2E2C26; --accent:#7C87FF; --on-accent:#0E0E14;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:20px 0;gap:12px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ctrl{display:flex;gap:8px}
.ctrl button{font:inherit;font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px;transition:border-color .2s,background .2s}
.ctrl button:hover{border-color:var(--ink)}
.ctrl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

header.hero{padding:56px 0 48px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,9vw,92px);line-height:.98;letter-spacing:-.02em;margin:14px 0 18px}
.hero h1 em{color:var(--accent);font-style:italic}
.hero p.role{font-family:var(--mono);font-size:13px;letter-spacing:.03em;color:var(--muted);margin:-6px 0 20px}
.hero p.lead{font-size:clamp(17px,2.2vw,20px);max-width:620px;color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:500;font-size:15px;text-decoration:none;padding:12px 18px;border-radius:10px;border:1px solid var(--ink);min-height:44px;transition:transform .15s,background .2s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}

section{display:grid;grid-template-columns:150px 1fr;gap:12px 32px;padding:40px 0;border-bottom:1px solid var(--line)}
section>h2{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.job{margin-bottom:28px}
.job:last-child{margin-bottom:0}
.job h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15}
.job .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin:4px 0 10px;letter-spacing:.03em}
.job ul{list-style:none}
.job li{position:relative;padding-left:18px;margin-bottom:6px;max-width:62ch}
.job li::before{content:"";position:absolute;left:0;top:.72em;width:8px;height:1px;background:var(--accent)}
.feat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px}
.feat h3{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin-bottom:8px}
.feat p{max-width:60ch}
.feat p+p{margin-top:10px}
.feat .btn{margin-top:18px}
.demo{margin:4px 0 18px}
.demo video{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#0e2a20}
.demo .v-tall{display:none;max-width:320px;margin:0 auto}
.demo figcaption{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--muted);margin-top:8px}
@media (max-width:680px){.demo .v-wide{display:none}.demo .v-tall{display:block}}
[hidden]{display:none!important}
.more{list-style:none}
.more li{padding:14px 0;border-bottom:1px solid var(--line)}
.more li:first-child{padding-top:0}
.more li:last-child{border-bottom:0;padding-bottom:0}
.more h3{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.15}
.more p{max-width:60ch;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
.skills dl{display:grid;grid-template-columns:1fr;gap:14px}
.skills dt{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.skills dd{max-width:64ch}
.edu li{list-style:none;margin-bottom:6px}
footer{padding:40px 0 64px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:baseline}
footer a.mail{font-family:var(--serif);font-size:clamp(26px,5vw,40px);text-decoration:none;border-bottom:1px solid var(--accent)}
footer a.mail:hover{color:var(--accent)}

@media (max-width:680px){
  section{grid-template-columns:1fr;gap:16px;padding:32px 0}
  header.hero{padding:36px 0 36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.btn:hover{transform:none}}
@media print{
  .bar,.cta,footer a.mail{display:none}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="mono">noahcuenca.com</span>
    <div class="ctrl">
      <button type="button" id="lang-es" aria-pressed="true">ES</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
      <button type="button" id="theme" aria-label="Cambiar tema">Tema</button>
    </div>
  </div>

  <header class="hero">
    <span class="mono" data-k="where"></span>
    <h1 id="name">Noah <em>Cuenca</em> Chacón</h1>
    <p class="role" data-k="role"></p>
    <p class="lead" data-k="lead"></p>
    <div class="cta">
      <a class="btn primary" id="dl" href="CV_Noah_Cuenca_ES.pdf" download data-k="download"></a>
      <a class="btn" id="mailbtn" href="mailto:noahworkscuenca@gmail.com" data-k="contact"></a>
    </div>
  </header>

  <main>
    <section>
      <h2 data-k="h_featured"></h2>
      <div class="feat">
        <h3>Ticksy</h3>
        <figure class="demo">
          <video class="v-wide" controls muted playsinline loop preload="none" poster="poster-16x9.jpg" data-k-aria="demo_alt"><source src="ticksy-demo-16x9.mp4" type="video/mp4"></video>
          <video class="v-tall" controls muted playsinline loop preload="none" poster="poster-9x16.jpg" data-k-aria="demo_alt"><source src="ticksy-demo-9x16.mp4" type="video/mp4"></video>
          <figcaption data-k="demo_note"></figcaption>
        </figure>
        <p data-k="featured"></p>
        <p data-k="featured2"></p>
        <p data-k="featured3"></p>
        <div class="tags"><span class="tag">PWA</span><span class="tag">JavaScript</span><span class="tag">Supabase</span><span class="tag" data-k="tag_ocr"></span><span class="tag">Loyverse POS</span></div>
        <div class="cta" id="feat-cta" style="margin-top:18px">
          <a class="btn" id="demo" href="#" target="_blank" rel="noopener" hidden data-k="demo"></a>
          <a class="btn" id="gh" href="#" target="_blank" rel="noopener" hidden data-k="code"></a>
        </div>
      </div>
    </section>

    <section>
      <h2 data-k="h_more"></h2>
      <ul class="more" id="more"></ul>
    </section>

    <section>
      <h2 data-k="h_exp"></h2>
      <div id="jobs"></div>
    </section>

    <section class="skills">
      <h2 data-k="h_skills"></h2>
      <dl id="skills"></dl>
    </section>

    <section class="edu">
      <h2 data-k="h_edu"></h2>
      <ul id="edu"></ul>
    </section>
  </main>

  <footer>
    <a class="mail" href="mailto:noahworkscuenca@gmail.com">noahworkscuenca@gmail.com</a>
    <span class="mono" data-k="loc"></span>
  </footer>
</div>

<script>
// Cuando tengas el link de la demo de Ticksy, pégalo aquí entre las comillas y se mostrará el botón.
const TICKSY_URL = "";
// Si decides mostrar el código en GitHub, pega aquí el link del repositorio y se mostrará el botón.
const GITHUB_URL = "";

const T = {
  es: {
    title: "Noah Cuenca Chacón · Desarrollador de software",
    where: "San José, Costa Rica",
    role: "Desarrollador de software · Python · Streamlit · Apps y sitios web a la medida",
    lead: "Profesional de operaciones y atención al cliente en transición hacia el desarrollo de software. Construyo y despliego apps y herramientas a la medida que simplifican procesos, y sitios web.",
    download: "Descargar CV (PDF)", contact: "Cuéntame qué necesitas", demo: "Ver demo de Ticksy", code: "Ver código en GitHub",
    demo_note: "Demo de 24 s con datos de ejemplo.", demo_alt: "Demo en video de Ticksy: foto de la factura, lectura automática y resumen de gastos del mes",
    h_featured: "App destacada", h_more: "Más proyectos", h_exp: "Experiencia", h_skills: "Habilidades", h_edu: "Formación",
    featured: "App para controlar las facturas de proveedores en restaurantes. Nació de un problema real en mi trabajo: se perdían facturas y había dinero que no se reflejaba en los gastos. La llevé del concepto al desarrollo, las pruebas, el despliegue y la iteración.",
    featured2: "Está en uso real y procesa alrededor de 100 facturas al mes. Incluye lectura de facturas con IA, integración con el POS Loyverse y soporte para varios restaurantes.",
    featured3: "Resultado: se evita perder facturas y dinero que no aparece en los gastos, se ahorra tiempo y el control de gastos queda más ordenado.",
    tag_ocr: "Lectura de facturas con IA",
    more: [
      ["Kontea", "App de control de inventario automático para restaurantes."],
      ["Sitio web interactivo para un libro", "Sitio a la medida con el libro hojeable en pantalla. En desarrollo."]
    ],
    loc: "Costa Rica",
    jobs: [
      { r: "Fundador y desarrollador", o: "Divende", d: "Estudio de desarrollo · Independiente · Presente", b: [
        "Desarrollo apps y herramientas a la medida para simplificar procesos de negocio, y creo sitios web para pequeños negocios.",
        "De Divende salen Ticksy, app de control de facturas, y Kontea, app de control de inventario.",
        "Despliego con entornos de prueba (staging) en GitHub para validar cambios antes de publicarlos.",
        "Uso herramientas de IA (Claude, Gemini, Google Flow) para acelerar código, contenido y recursos gráficos." ] },
      { r: "Jefe de piso", o: "Café Kracovia", d: "2020 – Presente", b: [
        "Apoyo en la toma de decisiones del servicio y coordino a 4 meseros. He capacitado a más de 15 personas.",
        "Detecté pérdidas de facturas y gastos sin reflejar en el flujo del local, y desarrollé Ticksy para resolverlo.",
        "Atiendo unas 40 comandas por servicio, de 2 a 5 bebidas cada una, preparando café y tragos bajo presión.",
        "Hago los pedidos de inventario con 4 proveedores fijos y mantengo contacto constante con otros proveedores." ] },
      { r: "Técnico judicial", o: "Poder Judicial de Costa Rica", d: "2023 · 3 meses", b: [
        "Gestión de documentación oficial bajo protocolos de confidencialidad y soporte administrativo en procesos judiciales." ] }
    ],
    skills: [
      ["Desarrollo de software y aplicaciones", "Python, Streamlit, JavaScript, Supabase, apps web instalables (PWA), GitHub, pruebas y resolución de problemas."],
      ["Herramientas de IA", "Claude, Gemini, Google Flow, lectura de documentos con IA (OCR)."],
      ["Soporte técnico, datos y procesos", "Soporte técnico, gestión de datos, mejora de procesos."],
      ["Operaciones", "Control de inventarios, compras a proveedores, capacitación de personal, CRM, resolución de conflictos."],
      ["Diseño", "Photoshop, Illustrator, Canva, CapCut."]
    ],
    edu: ["Técnico en Diseño Gráfico y Web (TEC), en curso", "Bachillerato en Ciencias Naturales, UNED, 2023 – actualidad", "Inglés B1 (intermedio)"],
    theme: "Cambiar tema", pdf: "CV_Noah_Cuenca_ES.pdf"
  },
  en: {
    title: "Noah Cuenca Chacón · Software Developer",
    where: "San José, Costa Rica",
    role: "Software Developer · Python · Streamlit · Custom Apps & Websites",
    lead: "Operations and customer-facing professional transitioning into software development. I build and deploy custom apps and tools that simplify processes, and websites.",
    download: "Download CV (PDF)", contact: "Tell me what you need", demo: "View Ticksy demo", code: "View code on GitHub",
    demo_note: "24-second demo with sample data.", demo_alt: "Ticksy video demo: photo of the invoice, automatic reading and monthly spending summary",
    h_featured: "Featured app", h_more: "More projects", h_exp: "Experience", h_skills: "Skills", h_edu: "Education",
    featured: "App to track supplier invoices in restaurants. It came from a real problem at my job: invoices were getting lost and money wasn't showing up in expenses. I took it from concept through development, testing, deployment, and iteration.",
    featured2: "It's in real use and processes around 100 invoices a month. It includes AI invoice reading, integration with the Loyverse POS, and support for multiple restaurants.",
    featured3: "Result: fewer lost invoices and less money missing from expenses, time saved, and more organized expense control.",
    tag_ocr: "AI invoice reading",
    more: [
      ["Kontea", "Automatic inventory control app for restaurants."],
      ["Interactive website for a book", "Custom site with the book browsable on screen. In development."]
    ],
    loc: "Costa Rica",
    jobs: [
      { r: "Founder & Developer", o: "Divende", d: "Development studio · Independent · Present", b: [
        "Develop custom apps and tools that simplify business processes, and build websites for small businesses.",
        "Divende is where Ticksy, an invoice-tracking app, and Kontea, an inventory control app, come from.",
        "Deploy with GitHub staging environments to validate changes before release.",
        "Use AI tools (Claude, Gemini, Google Flow) to speed up code, content, and graphic assets." ] },
      { r: "Floor Manager", o: "Café Kracovia", d: "2020 – Present", b: [
        "Support service decision-making and coordinate 4 servers. Have trained 15+ people.",
        "Spotted lost invoices and unrecorded expenses in the venue's invoice flow, and built Ticksy to fix it.",
        "Handle about 40 orders per service, 2 to 5 drinks each, preparing coffee and cocktails under pressure.",
        "Place inventory orders with 4 regular suppliers and stay in constant contact with other suppliers." ] },
      { r: "Judicial Technician", o: "Judicial Branch of Costa Rica", d: "2023 · 3 months", b: [
        "Managed official documentation under confidentiality protocols and provided administrative support in judicial processes." ] }
    ],
    skills: [
      ["Software & application development", "Python, Streamlit, JavaScript, Supabase, installable web apps (PWA), GitHub, testing and troubleshooting."],
      ["AI tools", "Claude, Gemini, Google Flow, AI document reading (OCR)."],
      ["Technical support, data & process", "Technical support, data management, process improvement."],
      ["Operations", "Inventory control, supplier purchasing, staff training, CRM, conflict resolution."],
      ["Design", "Photoshop, Illustrator, Canva, CapCut."]
    ],
    edu: ["Technical Degree in Graphic & Web Design (TEC), in progress", "Bachelor's in Natural Sciences, UNED, 2023 – present", "English B1 (intermediate)"],
    theme: "Toggle theme", pdf: "CV_Noah_Cuenca_EN.pdf"
  }
};

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll('[data-k]').forEach(n => { n.textContent = t[n.dataset.k]; });
  document.querySelectorAll('[data-k-aria]').forEach(n => { n.setAttribute('aria-label', t[n.dataset.kAria]); });
  $('#dl').href = t.pdf;
  const demo = $('#demo'); if (TICKSY_URL) { demo.href = TICKSY_URL; demo.hidden = false; } else { demo.hidden = true; }
  const gh = $('#gh'); if (GITHUB_URL) { gh.href = GITHUB_URL; gh.hidden = false; } else { gh.hidden = true; }
  $('#feat-cta').hidden = !(TICKSY_URL || GITHUB_URL);
  const more = $('#more'); more.replaceChildren();
  t.more.forEach(([n, d]) => { const li = el('li'); li.append(el('h3', '', n), el('p', '', d)); more.append(li); });
  $('#theme').setAttribute('aria-label', t.theme);
  $('#lang-es').setAttribute('aria-pressed', lang === 'es');
  $('#lang-en').setAttribute('aria-pressed', lang === 'en');

  const jobs = $('#jobs'); jobs.replaceChildren();
  t.jobs.forEach(j => {
    const w = el('div', 'job');
    w.append(el('h3', '', `${j.r}, ${j.o}`), el('p', 'meta', j.d));
    const ul = el('ul'); j.b.forEach(b => ul.append(el('li', '', b))); w.append(ul);
    jobs.append(w);
  });

  const sk = $('#skills'); sk.replaceChildren();
  t.skills.forEach(([k, v]) => { const g = el('div'); g.append(el('dt', '', k), el('dd', '', v)); sk.append(g); });

  const ed = $('#edu'); ed.replaceChildren();
  t.edu.forEach(e => ed.append(el('li', '', e)));
  try { localStorage.setItem('lang', lang); } catch (e) {}
}

function setTheme(th) {
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem('theme', th); } catch (e) {}
}

let saved = null, savedTheme = null;
try { saved = localStorage.getItem('lang'); savedTheme = localStorage.getItem('theme'); } catch (e) {}
const lang0 = saved || ((navigator.language || 'es').toLowerCase().startsWith('en') ? 'en' : 'es');
setTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
render(lang0);

$('#lang-es').addEventListener('click', () => render('es'));
$('#lang-en').addEventListener('click', () => render('en'));
$('#theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
